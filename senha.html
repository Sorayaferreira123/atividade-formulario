<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/senha.css">
    <title>Senha</title>
</head>
<body>
    <h1>Esqueceu a senha?</h1>
    <hr>
    <h3>Redefina sua senha em duas etapas</h3>
    <label for="email">Digite seu e-mail:</label>
    <input type="text"id="nome" placeholder="Digite seu e-mail"/><br>
    <label for="nova senha">Nova Senha:</label>
    <input type="password"id="nome" placeholder="Digite sua senha"/><br>
    <label for="confirmar nova senha">Confirmar nova Senha:</label>
    <input type="password"id="senha" placeholder="Confirme sua senha"/><br><br><br>
    <button type="submit">Alterar Senha</button><br><br>
    <div class="link">
        <a href="login.html">Voltar á página de login</a>
    </div class="link">
</body>
</html>
